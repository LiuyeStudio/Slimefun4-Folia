# This workflow builds the plugin with Maven and publishes a preview release.

name: Slimefun4-Folia Preview Builder

on:
  workflow_call:
  workflow_dispatch:

env:
  TZ: 'Asia/Shanghai'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          # git-commit-id 需要完整的提交历史
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ vars.JAVA_CI_VERSION || 21 }}
          java-package: jdk
          architecture: x64
          cache: maven
      - name: Codestyle Check
        run: mvn -B -ntp spotless:check
      - name: Build Slimefun4-Folia
        run: mvn -B -ntp clean package
      - name: Get build artifact filename
        run: |
          FILENAME=$(find target -maxdepth 1 -type f -name "Slimefun-*.jar" ! -name "*-sources.jar" -printf "%f\n")
          [ -n "$FILENAME" ]
          [ "$(printf "%s\n" "$FILENAME" | wc -l)" -eq 1 ]
          echo "SLIMEFUN_ARTIFACT_NAME=$FILENAME" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        name: Upload build artifact
        with:
          name: Slimefun4-Folia Build
          path: target/${{ env.SLIMEFUN_ARTIFACT_NAME }}
      - name: Publish preview release
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: exp
          name: Slimefun4-Folia Preview Build
          body: Automatically built from the latest commit on the main branch.
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          make_latest: false
          files: |
            target/${{ env.SLIMEFUN_ARTIFACT_NAME }}
