name: Spotless

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pom.xml'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'src/**'
      - 'pom.xml'
  workflow_dispatch:

env:
  TZ: 'Asia/Shanghai'

permissions:
  contents: write
  packages: read

jobs:
  spotless:
    runs-on: ubuntu-latest
    outputs:
        spotless-status: ${{ steps.spotless-check.outputs.status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ vars.JAVA_CI_VERSION || 21 }}
          java-package: jdk
          architecture: x64
          cache: maven

      - name: Spotless check
        id: spotless-check
        run: |
          set +e
          mvn -B -ntp spotless:check
          STATUS=$?
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          set -e
          exit $STATUS
        continue-on-error: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

  call-beta-ci:
    needs: [ spotless ]
    if: ${{ needs.spotless.outputs.spotless-status == '0' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'main' }}
    uses: ./.github/workflows/build-ci.yml
  call-pr-checker:
    needs: [ spotless ]
    if: ${{ needs.spotless.outputs.spotless-status == '0' && github.event_name == 'pull_request' }}
    uses: ./.github/workflows/pr-checker.yml
